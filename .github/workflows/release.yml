name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual run)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    # PyInstaller cannot cross-compile, so the Windows build has to happen on
    # Windows. This is why no Windows development machine is needed.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install Python dependencies
        run: uv sync --frozen --extra desktop

      - name: Build the application
        run: uv run --with pyinstaller pyinstaller packaging/jawut.spec --noconfirm

      - name: Smoke test the build
        shell: pwsh
        run: |
          # The packaged exe is windowed, so drive the server directly and prove
          # the bundle can serve its own frontend before anything is published.
          $exe = "dist/Jawut Object Annotation Tools/Jawut Object Annotation Tools.exe"
          if (-not (Test-Path $exe)) { throw "the executable was not produced" }
          # The build is windowed and so has no console to print the token to.
          # Supplying it here is the only way an automated check can learn it.
          $token = "ci-smoke-token"
          $env:JAWUT_LAUNCH_TOKEN = $token
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-window","--port","8765" -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/health" -TimeoutSec 5
                if ($health.data.status -eq "ok") { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "the packaged application never became healthy" }

            $page = Invoke-WebRequest "http://127.0.0.1:8765/" -TimeoutSec 10
            if ($page.StatusCode -ne 200) { throw "the bundled frontend was not served" }

            # Creating a project exercises the bundled schema.sql and sqlite. A
            # health check alone would pass on a build whose data files are
            # missing, and that failure would only surface for the user.
            if ($page.Content -notmatch [regex]::Escape("__JAWUT_TOKEN__=`"$token`"")) {
              throw "the launch token was not injected into the page"
            }
            $headers = @{ "X-Jawut-Token" = $token }
            $workspace = Join-Path $env:RUNNER_TEMP "smoke"

            $created = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/projects" `
              -Method Post -Headers $headers -ContentType "application/json" `
              -Body (@{ name = "Smoke"; parent_dir = $workspace } | ConvertTo-Json)
            if ($created.data.schema_version -lt 1) { throw "the project schema was not created" }

            $class = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/classes" `
              -Method Post -Headers $headers -ContentType "application/json" `
              -Body (@{ name = "Helmet" } | ConvertTo-Json)
            if (-not $class.data.id) { throw "a class could not be created" }

            # An unauthenticated call must be refused, or the token is decorative.
            try {
              Invoke-RestMethod "http://127.0.0.1:8765/api/v1/classes" -TimeoutSec 5 | Out-Null
              throw "the API answered without a launch token"
            } catch [System.Net.WebException], [Microsoft.PowerShell.Commands.HttpResponseException] {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
            }

            Write-Host "packaged build serves its frontend, creates projects and enforces its token"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package the zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }
          Compress-Archive `
            -Path "dist/Jawut Object Annotation Tools/*" `
            -DestinationPath "Jawut-Object-Annotation-Tools-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "*.zip"
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The guide PDF is committed, so the copy attached here is always the
          # one that matches this tag. It was uploaded by hand before, which is
          # how a release could end up describing a different build.
          files: |
            *.zip
            docs/USER_GUIDE.pdf
          draft: false
          # generate_release_notes adds the commit list under this; this block is
          # what someone who has never seen the project needs before that.
          generate_release_notes: true
          body: |
            A Windows desktop app for drawing bounding boxes and exporting YOLO
            datasets. One folder, one executable — no Python, no database, no
            installer, no account, no internet.

            ## Install

            1. Download **`Jawut-Object-Annotation-Tools-*-windows.zip`** below
            2. Extract it anywhere — your Desktop is fine
            3. Run **`Jawut Object Annotation Tools.exe`**

            Windows 10 or 11, 64-bit. Nothing else is required.

            ## ⚠️ Windows will warn you the first time — it is not a virus warning

            You will see a blue box saying **"Windows protected your PC —
            Microsoft Defender SmartScreen prevented an unrecognised app from
            starting."**

            > Click **More info** (the small link, easy to miss), then
            > **Run anyway**. Windows only asks once.

            **Windows is not saying the file is harmful.** It is saying it does
            not recognise the *publisher*. Windows trusts apps carrying a paid
            **code-signing certificate**, which costs a few hundred dollars a
            year; this build does not have one, so it looks unknown to
            SmartScreen no matter what is inside it. Every new app from a small
            team looks exactly like this.

            If you would rather verify than trust:

            - It binds to `127.0.0.1` only, so nothing outside your machine can
              reach it, and it exits when you close the window.
            - It touches only the folders you point it at.
            - This zip was built and smoke-tested by GitHub Actions from the
              tagged source, not uploaded from anyone's laptop.

            If it will not start at all, Windows has flagged the download:
            right-click the zip → **Properties** → tick **Unblock** → **OK**,
            then extract again.

            ## Documentation

            **`USER_GUIDE.pdf`** below is the full illustrated walkthrough, from
            a blank screen to an exported dataset. Hand it to anyone who will
            never open this repository.
