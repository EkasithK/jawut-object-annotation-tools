[project]
name = "jawut"
version = "0.3.3"
description = "Jawut Object Annotation Tools — bounding-box annotation for YOLO datasets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
jawut = "jawut.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jawut"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["jawut", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = false
mypy_path = "src"
packages = ["jawut"]

[[tool.mypy.overrides]]
module = ["webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." makes `tests.conftest` importable so shared fixture types can be reused.
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/jawut"]
omit = ["src/jawut/__main__.py"]
